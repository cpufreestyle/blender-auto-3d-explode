# 仓库唯一的质量门。此前另有 .github/workflows/build-and-test.yml，对同一批文件重复做
# JS/CSS lint + 测试 + 构建 + audit，两条 workflow 还会给出互相矛盾的信号（一个红一个绿），
# 已删除并合并到本文件。新增门禁请加到这里，不要另起 workflow。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        # 用不带 --fix 的变体：CI 要检查源码本身，而不是在 runner 上边跑边改
        run: npm run lint:check

      - name: Lint CSS
        run: npm run lint:css:check

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Security audit
        run: npm audit
        continue-on-error: true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          if-no-files-found: error

  python:
    name: Python — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Lint Python
        run: |
          # 固定 ruff 版本：未锁版本时上游新版本新增规则会让与本次改动无关的提交变红。
          # 规则集与行宽由仓库根目录 ruff.toml 决定，命令行不再重复传 --line-length。
          pip install "ruff==0.16.8"
          # 覆盖 Blender 脚本目录（此前仅检查根目录 *.py，漏掉 scripts/ 与 blender_scripts/）
          ruff check *.py scripts/*.py blender_scripts/*.py tests/*.py

      - name: Run tests
        run: |
          # 同样固定 pytest：大版本升级可能改变收集/断言语义，让与本次改动无关的提交变红。
          # numpy 必须显式安装：img2depth_test 的深度先验测试依赖它，否则整组 skip。
          # 本地复现：uvx --with numpy pytest@8 tests/ -q
          pip install "pytest==8.4.2" "numpy"
          pytest tests/ -v
